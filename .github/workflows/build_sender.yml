name: Build Serial Sender (Windows)

on:
  push:
    paths:
      - 'serial_sender.py'
      - '.github/workflows/build_sender.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and pyserial
        run: pip install pyinstaller pyserial

      - name: Build exe
        run: pyinstaller -F -n SerialSender --clean serial_sender.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialSender-Windows
          path: dist/SerialSender.exe
