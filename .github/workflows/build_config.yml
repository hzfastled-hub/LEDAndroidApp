name: Build LED Config Tool (Windows)

on:
  push:
    paths:
      - 'config_tool.py'
      - '.github/workflows/build_config.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller -F -n LEDConfigTool --clean config_tool.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDConfigTool-Windows
          path: dist/LEDConfigTool.exe
